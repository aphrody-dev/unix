# /etc/wsl.conf - Sovereign Omarchy + CachyOS + Arch WSL2 Guest Configuration
[boot]
systemd=true
command="/usr/bin/mkdir -p /run/wslg /tmp/.X11-unix"

[automount]
enabled=true
root=/mnt/
options="metadata,umask=22,fmask=11"
mountFsTab=true

[interop]
enabled=true
appendWindowsPath=true

[network]
generateHosts=true
generateResolvConf=true
hostname=aphrody-omarchy

[user]
default=aphrody
