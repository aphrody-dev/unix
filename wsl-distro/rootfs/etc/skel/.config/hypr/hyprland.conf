# ~/.config/hypr/hyprland.conf - Omarchy + Rust WSLg Direct3D 12 (/dev/dxg) Compositor Config
source = ~/.config/hypr/hyprland-colors.conf

env = GALLIUM_DRIVER,d3d12
env = MESA_D3D12_DEFAULT_ADAPTER_NAME,NVIDIA GeForce RTX 4070
env = WGPU_BACKEND,vulkan
env = XDG_CURRENT_DESKTOP,Hyprland:COSMIC
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland

monitor = DP-1, 2560x1440@120, 0x0, 1

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
}

# Omarchy Keyboard-First Workflow Bindings
bind = SUPER, SPACE, exec, omarchy-menu
bind = SUPER, K, exec, omarchy-menu-keybindings
bind = SUPER, RETURN, exec, ghostty
bind = SUPER, W, killactive,
bind = SUPER SHIFT, T, exec, omarchy-wsl themes export tokyo-night
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
