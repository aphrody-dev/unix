# /etc/pacman.conf - Unified CachyOS v3 + Omarchy + Arch Linux GitLab Repositories
# Target Hardware: 13th Gen Intel(R) Core(TM) i7-13700F (x86-64-v3) + NVIDIA GeForce RTX 4070

[options]
HoldPkg           = pacman glibc
Architecture      = auto x86_64_v3 x86_64
ParallelDownloads = 16
Color
ILoveCandy
CheckSpace
VerbosePkgLists
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# 1. CachyOS x86-64-v3 AVX2/FMA3/BMI2 Tier
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# 2. Omarchy Quattro Desktop & Shell Repository
[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/stable/$arch

# 3. Arch Linux Canonical Repositories (gitlab.archlinux.org)
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
