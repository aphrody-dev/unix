# Aether-in-Rust Hyprland Theme: tokyo-night (dark)
$activeBorderColor = rgba(7aa2f7ee) rgba(7aa2f7ee) 45deg
$inactiveBorderColor = rgba(414868aa)
$shadowColor = rgba(0e0e14ee)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

decoration {
    shadow {
        enabled = true
        color = $shadowColor
    }
}

group {
    col.border_active = rgba(7aa2f7ee)
    col.border_inactive = rgba(24283baa)
    groupbar {
        col.active = rgba(7aa2f7ee)
        col.inactive = rgba(24283baa)
        text_color = rgb(a9b1d6)
    }
}
