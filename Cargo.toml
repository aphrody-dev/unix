[workspace]
members = [
    "crates/unix-uutils",
    "crates/unix-cachyos",
    "crates/unix-distro",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
anyhow = "1.0"
raw-cpuid = "11.2"
